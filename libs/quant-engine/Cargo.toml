[package]
name = "quant-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Pure, side-effect-free Convexa quant compute: GEX, max pain, walls, flip, DEX"
license = "UNLICENSED"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
libm = "0.2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"

[dev-dependencies]
approx = "0.5"
serde_json = "1"

[[bench]]
name = "gex_bench"
harness = false

[features]
default = ["simd"]
# Explicit AVX2/runtime-dispatched GEX kernel (always compiled; feature is documentation).
simd = []

# Aligned alloc + AVX2 intrinsics live in soa/simd modules only.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
float_cmp = "allow"
