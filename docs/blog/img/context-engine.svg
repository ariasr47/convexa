<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>How memory works without baggage: one constant ground-truth file, plus a compress step</title>
  <desc>A tall pillar labelled the constant ground truth feeds every session. A fresh session reads a contract and the constant, does messy work full of options and debate, then a compress step keeps the decisions and drops the debate, producing a small dense contract that becomes the next session's handoff. The next session starts fresh again.</desc>
  <style>
    text{font-family:'IBM Plex Sans',system-ui,sans-serif}
    .h1{fill:#E9E4D6;font-size:23px;font-weight:700}
    .sub{fill:#8A9BB4;font-size:13.5px}
    .ct{fill:#E9E4D6;font-size:15px;font-weight:600}
    .cs{fill:#8A9BB4;font-size:11px}
    .pill-t{fill:#5E8BC4;font-size:15px;font-weight:700}
    .note{fill:#8A9BB4;font-size:12.5px}
    .loop{fill:#8A9BB4;font-size:12.5px;font-style:italic}
  </style>
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#5E8BC4"/></marker>
    <marker id="arl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#F2A93B"/></marker>
    <marker id="arn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#8A9BB4"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="468" rx="16" fill="#131A24" stroke="#8A9BB4" stroke-opacity="0.25"/>

  <text class="h1" x="36" y="46">Memory without baggage</text>
  <text class="sub" x="36" y="70">One stable rulebook everyone shares — plus a squeeze step that keeps the decisions and forgets the noise.</text>

  <!-- Constant pillar -->
  <rect x="28" y="100" width="156" height="250" rx="12" fill="#1B2432" stroke="#5E8BC4" stroke-width="2"/>
  <text class="pill-t" x="106" y="150" text-anchor="middle">The constant</text>
  <text class="pill-t" x="106" y="170" text-anchor="middle">ground truth</text>
  <text class="cs" x="106" y="196" text-anchor="middle">GAMMAFLOW_</text>
  <text class="cs" x="106" y="210" text-anchor="middle">CONTEXT.md</text>
  <line x1="56" y1="228" x2="156" y2="228" stroke="#5E8BC4" stroke-width="1" stroke-dasharray="2 2"/>
  <text class="cs" x="106" y="252" text-anchor="middle">read by</text>
  <text class="cs" x="106" y="266" text-anchor="middle">every session</text>

  <!-- dotted feed from pillar -->
  <path d="M184,200 C210,200 210,210 232,210" stroke="#5E8BC4" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <path d="M184,250 C420,330 620,300 700,236" stroke="#5E8BC4" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

  <!-- contract in chip -->
  <rect x="236" y="120" width="118" height="30" rx="7" fill="#1B2432" stroke="#8A9BB4" stroke-opacity="0.5"/>
  <text class="cs" x="295" y="139" text-anchor="middle" font-weight="600" fill="#E9E4D6">Contract in</text>
  <line x1="295" y1="150" x2="295" y2="176" stroke="#8A9BB4" stroke-width="2" marker-end="url(#arn)"/>

  <!-- Fresh session -->
  <rect x="234" y="178" width="142" height="92" rx="12" fill="#1B2432" stroke="#5E8BC4" stroke-width="2"/>
  <circle cx="305" cy="206" r="9" fill="#131A24" stroke="#5E8BC4" stroke-width="1.5"/>
  <text x="305" y="211" text-anchor="middle" font-size="12" fill="#E9E4D6">✦</text>
  <text class="ct" x="305" y="238" text-anchor="middle">Fresh session</text>
  <text class="cs" x="305" y="256" text-anchor="middle">no memory of the chat</text>

  <line x1="376" y1="224" x2="408" y2="224" stroke="#5E8BC4" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- messy work blob -->
  <rect x="412" y="178" width="150" height="92" rx="34" fill="#1B2432" stroke="#8A9BB4" stroke-opacity="0.4" stroke-width="1.5"/>
  <g fill="#8A9BB4" fill-opacity="0.7">
    <circle cx="438" cy="204" r="3"/><circle cx="460" cy="214" r="3"/><circle cx="486" cy="200" r="3"/>
    <circle cx="510" cy="216" r="3"/><circle cx="534" cy="206" r="3"/><circle cx="450" cy="232" r="3"/>
    <circle cx="478" cy="240" r="3"/><circle cx="506" cy="234" r="3"/><circle cx="528" cy="244" r="3"/>
    <circle cx="496" cy="222" r="3"/>
  </g>
  <text class="cs" x="487" y="196" text-anchor="middle">the messy middle</text>
  <text class="cs" x="487" y="264" text-anchor="middle">options · debate · dead-ends</text>

  <line x1="562" y1="224" x2="588" y2="224" stroke="#F2A93B" stroke-width="2" marker-end="url(#arl)"/>

  <!-- compressor funnel — the element that matters (the one amber family) -->
  <polygon points="592,178 690,200 690,248 592,270" fill="#1B2432" stroke="#F2A93B" stroke-width="2"/>
  <text x="632" y="220" text-anchor="middle" fill="#F2A93B" font-size="12.5" font-weight="700" font-family="'IBM Plex Sans',system-ui,sans-serif">COMPRESS</text>
  <text x="632" y="236" text-anchor="middle" fill="#8A9BB4" font-size="9.5" font-family="'IBM Plex Sans',system-ui,sans-serif">keep · drop noise</text>

  <line x1="690" y1="224" x2="712" y2="224" stroke="#F2A93B" stroke-width="2" marker-end="url(#arl)"/>

  <!-- contract out -->
  <rect x="716" y="194" width="150" height="60" rx="11" fill="#1B2432" stroke="#5E8BC4" stroke-width="2"/>
  <text class="ct" x="791" y="220" text-anchor="middle">Contract out</text>
  <text class="cs" x="791" y="238" text-anchor="middle">small · dense · self-contained</text>

  <!-- loop back -->
  <path d="M791,254 C791,360 305,372 305,300 L305,272" stroke="#8A9BB4" stroke-opacity="0.7" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arn)"/>
  <text class="loop" x="548" y="392" text-anchor="middle">The next session inherits only this small contract — and starts fresh again.</text>

  <text class="note" x="36" y="392">Nothing is re-explained.</text>
  <text class="note" x="36" y="409">Nothing important is lost.</text>
</svg>
