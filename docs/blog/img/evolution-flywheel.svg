<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>The evolution: a compounding flywheel of discover, decide, build, measure — two upgrades shipped, two still ahead</title>
  <desc>A central loop turns through four stages: Discover, Decide, Build, Measure, then back to Discover. Four upgrades surround it. Two are now shipped (shown with a check): automated gate-checks — a linter plus a live integration check — and a memory that compounds by promoting proven decisions into the rulebook and demoting them when reality disagrees. Two are still ahead (shown muted): parallel feature lanes, and production metrics fed back into discovery to close the loop.</desc>
  <style>
    text{font-family:'IBM Plex Sans',system-ui,sans-serif}
    .h1{fill:#E9E4D6;font-size:23px;font-weight:700}
    .sub{fill:#8A9BB4;font-size:13px}
    .stage{fill:#E9E4D6;font-size:14px;font-weight:700}
    .ctr{fill:#5E8BC4;font-size:14px;font-weight:700}
    .upt{font-size:13px;font-weight:700}
    .ups{font-size:11px}
  </style>
  <defs>
    <marker id="fc" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#5E8BC4"/></marker>
  </defs>
  <rect x="1" y="1" width="958" height="538" rx="16" fill="#131A24" stroke="#8A9BB4" stroke-opacity="0.25"/>
  <text class="h1" x="34" y="44">Where this goes next</text>
  <text class="sub" x="34" y="68">Turn the relay into a flywheel — each loop cheaper and smarter than the last. Two upgrades shipped; two still ahead.</text>

  <!-- center loop -->
  <circle cx="480" cy="312" r="120" fill="none" stroke="#5E8BC4" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="2 4"/>
  <circle cx="480" cy="312" r="64" fill="#1B2432" stroke="#5E8BC4" stroke-width="2"/>
  <text class="ctr" x="480" y="306" text-anchor="middle">Compounding</text>
  <text class="ctr" x="480" y="324" text-anchor="middle">flywheel</text>

  <!-- four stages on the loop (Build = the one amber accent) -->
  <g>
    <circle cx="480" cy="192" r="30" fill="#0B0F17" stroke="#5E8BC4" stroke-width="2"/>
    <text class="stage" x="480" y="197" text-anchor="middle">Discover</text>
  </g>
  <g>
    <circle cx="600" cy="312" r="30" fill="#0B0F17" stroke="#5E8BC4" stroke-width="2"/>
    <text class="stage" x="600" y="317" text-anchor="middle">Decide</text>
  </g>
  <g>
    <circle cx="480" cy="432" r="30" fill="#0B0F17" stroke="#F2A93B" stroke-width="2"/>
    <text class="stage" x="480" y="437" text-anchor="middle">Build</text>
  </g>
  <g>
    <circle cx="360" cy="312" r="30" fill="#0B0F17" stroke="#5E8BC4" stroke-width="2"/>
    <text class="stage" x="360" y="317" text-anchor="middle">Measure</text>
  </g>
  <!-- clockwise arrows between stages -->
  <g fill="none" stroke="#5E8BC4" stroke-width="2.5">
    <path d="M510,200 A120,120 0 0 1 572,288" marker-end="url(#fc)"/>
    <path d="M572,336 A120,120 0 0 1 510,424" marker-end="url(#fc)"/>
    <path d="M450,424 A120,120 0 0 1 388,336" marker-end="url(#fc)"/>
    <path d="M388,288 A120,120 0 0 1 450,200" marker-end="url(#fc)"/>
  </g>

  <!-- LEFT = shipped (signal) -->
  <g>
    <rect x="34" y="112" width="240" height="84" rx="11" fill="#1B2432" stroke="#5E8BC4" stroke-width="1.6"/>
    <text class="upt" x="50" y="136" fill="#E9E4D6">Automated gate-checks</text>
    <text class="ups" x="50" y="156" fill="#5E8BC4" font-weight="700">✓ shipped</text>
    <text class="ups" x="50" y="174" fill="#8A9BB4">a handoff linter + a live</text>
    <text class="ups" x="50" y="189" fill="#8A9BB4">integration check, before each step</text>
  </g>
  <g>
    <rect x="34" y="426" width="240" height="84" rx="11" fill="#1B2432" stroke="#5E8BC4" stroke-width="1.6"/>
    <text class="upt" x="50" y="450" fill="#E9E4D6">Memory that compounds</text>
    <text class="ups" x="50" y="470" fill="#5E8BC4" font-weight="700">✓ shipped</text>
    <text class="ups" x="50" y="488" fill="#8A9BB4">proven decisions graduate to canon —</text>
    <text class="ups" x="50" y="503" fill="#8A9BB4">and demote when reality disagrees</text>
  </g>

  <!-- RIGHT = still ahead (muted) -->
  <g>
    <rect x="686" y="112" width="240" height="84" rx="11" fill="#1B2432" stroke="#8A9BB4" stroke-opacity="0.4"/>
    <text class="upt" x="702" y="136" fill="#E9E4D6">Parallel feature lanes</text>
    <text class="ups" x="702" y="156" fill="#8A9BB4" font-weight="700">↗ on the roadmap (last)</text>
    <text class="ups" x="702" y="174" fill="#8A9BB4">many features in flight at once,</text>
    <text class="ups" x="702" y="189" fill="#8A9BB4">scheduled by the orchestrator</text>
  </g>
  <g>
    <rect x="686" y="426" width="240" height="84" rx="11" fill="#1B2432" stroke="#8A9BB4" stroke-opacity="0.4"/>
    <text class="upt" x="702" y="450" fill="#E9E4D6">Metrics close the loop</text>
    <text class="ups" x="702" y="470" fill="#8A9BB4" font-weight="700">↗ on the roadmap</text>
    <text class="ups" x="702" y="488" fill="#8A9BB4">live performance data feeds</text>
    <text class="ups" x="702" y="503" fill="#8A9BB4">the next round of ideas</text>
  </g>

  <!-- connectors from cards to nearest stage -->
  <g stroke="#5E8BC4" stroke-width="1.4" stroke-dasharray="3 3">
    <line x1="274" y1="154" x2="452" y2="188"/>
    <line x1="274" y1="468" x2="452" y2="432"/>
  </g>
  <g stroke="#8A9BB4" stroke-opacity="0.5" stroke-width="1.4" stroke-dasharray="3 3">
    <line x1="686" y1="154" x2="624" y2="296"/>
    <line x1="686" y1="468" x2="386" y2="324"/>
  </g>
</svg>
