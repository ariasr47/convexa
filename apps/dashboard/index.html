<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>Convexa — AI dealer-gamma analytics for options traders</title>
    <meta
      name="description"
      content="Convexa reads dealer gamma exposure — call/put walls, the gamma flip, live order flow — plus an AI read on your positioning. An analysis tool; trades are simulated."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B0F17" />
    <!-- Blocking first-paint hint: local light pref must not flash the dark canvas. No-JS and
         anonymous never-touched stay dark (AC-A3). Hexes are the palette canvas tokens; pinned
         by firstPaintTheme.spec.ts. Duplicate of resolveFirstPaintMode — cannot import the module. -->
    <script>
      (function () {
        var DARK = '#0B0F17';
        var LIGHT = '#F6F6F3';
        var mode = 'dark';
        try {
          var cached = localStorage.getItem('convexa.theme-paint');
          if (cached === 'light' || cached === 'dark') {
            mode = cached;
          } else {
            var raw =
              localStorage.getItem('convexa.uiprefs.v1') ||
              localStorage.getItem('gammaflow.uiprefs.v1');
            var pref = raw ? JSON.parse(raw).theme : 'dark';
            if (pref === 'light') mode = 'light';
            else if (
              pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: light)').matches
            )
              mode = 'light';
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', mode);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', mode === 'light' ? LIGHT : DARK);
      })();
    </script>
    <link rel="canonical" href="https://convexa.pages.dev/" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, iMessage, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Convexa" />
    <meta property="og:title" content="Convexa — See the AI read on your real positioning" />
    <meta
      property="og:description"
      content="Dealer gamma walls, the gamma flip, live order flow, and an AI read on your positioning. An analysis tool; trades are simulated."
    />
    <meta property="og:url" content="https://convexa.pages.dev/" />
    <meta property="og:image" content="https://convexa.pages.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Convexa — dealer-gamma analytics" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Convexa — See the AI read on your real positioning" />
    <meta
      name="twitter:description"
      content="Dealer gamma walls, the gamma flip, live order flow, and an AI read on your positioning. An analysis tool; trades are simulated."
    />
    <meta name="twitter:image" content="https://convexa.pages.dev/og-image.png" />
    <meta name="twitter:image:alt" content="Convexa — dealer-gamma analytics" />

    <!-- The arc-X monogram (redesign-stage-2 §3.4): SVG first, .ico fallback, apple-touch 180. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Self-hosted first-paint faces (same-origin only): body sans + data mono, 400. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ibm-plex-sans/ibm-plex-sans-latin-400-normal.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/ibm-plex-mono/ibm-plex-mono-latin-400-normal.woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>

  </body>
</html>
