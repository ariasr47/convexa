# Convexa dashboard — static SPA server + /api reverse proxy.
# Installed at /etc/nginx/conf.d/default.conf in the runtime stage.
#
# Image: fholzer/nginx-brotli (ngx_brotli + standard gzip). Precompressed
# siblings (*.br / *.gz) are produced by tools/precompress-dashboard.mjs after
# the Vite production build. Prefer static files (zero CPU) over on-the-fly.
#
# Cloudflare Pages path does NOT use this file — CF negotiates br/gzip at the edge.

server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # ----- Precompressed static assets (hashed /assets/* from Vite) -----
    # Serve .br when the client advertises br; else .gz; else identity.
    brotli_static on;
    gzip_static   on;

    # On-the-fly fallback for anything without a sibling (or tiny files we skipped).
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Never serve sourcemaps from the public root (belt-and-braces; prod build archives them out of dist).
    location ~* \.map$ {
        return 404;
    }

    # Long-cache hashed assets (filenames include content hash).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA shell — always revalidate.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    # SPA client-side routing (react-router BrowserRouter): serve index.html for
    # any path that isn't a real static file, so deep links / refreshes work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse proxy — recreates the Vite dev proxy inside the container.
    # `api` resolves to the backend service via the compose network DNS name.
    # NO_INTERFACE_CHANGE: same-origin /api/* paths, just relocated from Vite.
    location /api {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE-safe (GET /api/stream/{ticker} is a long-lived text/event-stream):
        # disable response buffering so events flush immediately, and raise the
        # read timeout well past the 15s heartbeat so nginx never drops the stream.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 1h;
        # The backend already sets X-Accel-Buffering: no on the stream; honored here.
    }
}
