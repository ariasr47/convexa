[workspace]
resolver = "2"
members = [
    "libs/quant-engine",
    "apps/api",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quant-engine = { path = "libs/quant-engine" }

[profile.release]
lto = "thin"
codegen-units = 1
