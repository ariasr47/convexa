# Post-merge prod smoke — read-only checks against live URLs.
#
# Repo variable (Settings → Secrets and variables → Actions → Variables):
#   SMOKE_API_ORIGIN=https://convexa-production.up.railway.app
#   SMOKE_PAGES_ORIGIN=https://convexa.pages.dev   (optional)
#
name: Deploy smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Prod smoke (health · ticker · scan)
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve API origin
        id: origin
        env:
          SMOKE_API_ORIGIN: ${{ vars.SMOKE_API_ORIGIN }}
        run: |
          set -euo pipefail
          ORIGIN="${SMOKE_API_ORIGIN:-}"
          if [ -z "$ORIGIN" ]; then
            echo "::notice title=Smoke skipped::Set repository variable SMOKE_API_ORIGIN (Actions → Variables)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ORIGIN="${ORIGIN%/}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "api=$ORIGIN" >> "$GITHUB_OUTPUT"
          echo "Using API origin: $ORIGIN"

      - name: Health + scanner board
        if: steps.origin.outputs.skip != 'true'
        run: |
          set -euo pipefail
          body=$(curl -fsS "${{ steps.origin.outputs.api }}/api/health")
          printf '%s' "$body" > /tmp/health.json
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q 'api-rust'
          # Board must have durable scores after cold catch-up / RTH (empty desk regression).
          python3 - <<'PY'
          import json, sys
          h = json.load(open("/tmp/health.json"))
          board = (h.get("scanner") or {}).get("board") or {}
          scored = board.get("scored")
          rows = board.get("rows")
          by = board.get("by_status") or {}
          print(f"board rows={rows} scored={scored} by_status={by} history_samples={board.get('history_samples')}")
          if scored is None:
              # Older binary without board readout — soft fail with notice.
              print("::notice::scanner.board.scored missing (pre-board health); skipping scored assert")
              sys.exit(0)
          if int(scored) < 1:
              print("::error::scanner board has no scored rows (stuck building / write path broken)")
              sys.exit(1)
          PY

      - name: Ticker SPY (bundle, or the paused reply when health says paused)
        if: steps.origin.outputs.skip != 'true'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/ticker.json -w "%{http_code}" \
            "${{ steps.origin.outputs.api }}/api/ticker/SPY")
          market_data=$(python3 -c "import json; print(json.load(open('/tmp/health.json')).get('market_data', 'live'))")
          if [ "$market_data" = "paused" ]; then
            test "$code" = "503"
            grep -q '"code":"market_data_paused"' /tmp/ticker.json
            grep -q '"detail":"Market data is paused."' /tmp/ticker.json
          else
            test "$code" = "200"
            grep -q market_state /tmp/ticker.json
          fi

      - name: Scan envelope
        if: steps.origin.outputs.skip != 'true'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/scan.json -w "%{http_code}" \
            "${{ steps.origin.outputs.api }}/api/scan")
          test "$code" = "200"
          grep -q '"rows"' /tmp/scan.json
          # At least one non-building row when the board is live.
          python3 - <<'PY'
          import json, sys
          scan = json.load(open("/tmp/scan.json"))
          rows = scan.get("rows") or []
          okish = [r for r in rows if r.get("status") in ("ok", "stale") or r.get("score") is not None]
          print(f"scan rows={len(rows)} okish={len(okish)}")
          if rows and not okish:
              print("::error::/api/scan rows present but all building/unscored")
              sys.exit(1)
          PY

      - name: Structure history endpoint
        if: steps.origin.outputs.skip != 'true'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/hist.json -w "%{http_code}" \
            "${{ steps.origin.outputs.api }}/api/scan/SPY/history?limit=3")
          test "$code" = "200"
          grep -q '"samples"' /tmp/hist.json
          grep -q '"basis"' /tmp/hist.json
          python3 - <<'PY'
          import json, sys
          hist = json.load(open("/tmp/hist.json"))
          n = len(hist.get("samples") or [])
          print(f"SPY history samples={n}")
          # Soft: history may lag first full pass by a few minutes after deploy.
          # Hard-fail only when health says history_samples>0 but this path is empty.
          try:
              h = json.load(open("/tmp/health.json"))
              total = ((h.get("scanner") or {}).get("board") or {}).get("history_samples")
          except Exception:
              total = None
          if total is not None and int(total) > 0 and n == 0:
              print("::error::health reports history samples but SPY history is empty")
              sys.exit(1)
          if n == 0:
              print("::notice::SPY history empty (cold or first pass still running)")
          PY

      - name: Pages SPA (optional)
        if: steps.origin.outputs.skip != 'true' && vars.SMOKE_PAGES_ORIGIN != ''
        env:
          SMOKE_PAGES_ORIGIN: ${{ vars.SMOKE_PAGES_ORIGIN }}
        run: |
          set -euo pipefail
          ORIGIN="${SMOKE_PAGES_ORIGIN%/}"
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$ORIGIN/")
          test "$code" = "200"
