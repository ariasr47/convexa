# Post-merge prod smoke — read-only checks against live URLs (no deploy secrets required).
#
# Configure (repo Settings → Secrets and variables → Actions → Variables):
#   SMOKE_API_ORIGIN=https://convexa-production.up.railway.app
#   SMOKE_PAGES_ORIGIN=https://convexa.pages.dev   (optional)
#
# Also accepted as Actions *secrets* with the same names (if set by mistake).
# Railway/Pages CD: host dashboards auto-deploy on main (see docs/DEPLOY_RUNBOOK.md).
name: Deploy smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Prod smoke (health · ticker · scan)
    runs-on: ubuntu-latest
    steps:
      - name: Resolve API origin
        id: origin
        env:
          FROM_VAR: ${{ vars.SMOKE_API_ORIGIN }}
          FROM_SECRET: ${{ secrets.SMOKE_API_ORIGIN }}
        run: |
          set -euo pipefail
          ORIGIN="${FROM_VAR:-}"
          if [ -z "$ORIGIN" ]; then ORIGIN="${FROM_SECRET:-}"; fi
          if [ -z "$ORIGIN" ]; then
            echo "::notice title=Smoke skipped::Set repository variable SMOKE_API_ORIGIN under Settings → Secrets and variables → Actions → Variables"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ORIGIN="${ORIGIN%/}"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "api=$ORIGIN" >> "$GITHUB_OUTPUT"
          echo "Using API origin: $ORIGIN"

      - name: Health
        if: steps.origin.outputs.skip != 'true'
        run: |
          set -euo pipefail
          body=$(curl -fsS "${{ steps.origin.outputs.api }}/api/health")
          echo "$body" | tee /tmp/health.json
          echo "$body" | grep -q '"status":"ok"'
          echo "$body" | grep -q 'api-rust'

      - name: Ticker SPY (bundle)
        if: steps.origin.outputs.skip != 'true'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/ticker.json -w "%{http_code}" \
            "${{ steps.origin.outputs.api }}/api/ticker/SPY")
          test "$code" = "200"
          grep -q market_state /tmp/ticker.json

      - name: Scan envelope
        if: steps.origin.outputs.skip != 'true'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/scan.json -w "%{http_code}" \
            "${{ steps.origin.outputs.api }}/api/scan")
          test "$code" = "200"
          grep -q '"rows"' /tmp/scan.json

      - name: Structure history endpoint
        if: steps.origin.outputs.skip != 'true'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/hist.json -w "%{http_code}" \
            "${{ steps.origin.outputs.api }}/api/scan/SPY/history?limit=3")
          test "$code" = "200"
          grep -q '"samples"' /tmp/hist.json
          grep -q '"basis"' /tmp/hist.json

      - name: Pages SPA (optional)
        if: ${{ steps.origin.outputs.skip != 'true' && (vars.SMOKE_PAGES_ORIGIN != '' || secrets.SMOKE_PAGES_ORIGIN != '') }}
        env:
          FROM_VAR: ${{ vars.SMOKE_PAGES_ORIGIN }}
          FROM_SECRET: ${{ secrets.SMOKE_PAGES_ORIGIN }}
        run: |
          set -euo pipefail
          ORIGIN="${FROM_VAR:-${FROM_SECRET:-}}"
          ORIGIN="${ORIGIN%/}"
          code=$(curl -sS -o /dev/null -w "%{http_code}" "$ORIGIN/")
          test "$code" = "200"
