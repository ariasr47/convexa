name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - run: npx nx format:check --base="remotes/origin/main"
      # This workspace is not connected to Nx Cloud, so the Cloud-only steps
      # (start-ci-run, record, fix-ci, the atomized e2e-ci target) are omitted;
      # plain "e2e" runs the Cypress suite in a single task instead.
      - run: npx nx run-many -t lint test build typecheck e2e
