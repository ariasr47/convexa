# CI mode (2026-10-08): manual. Reason: cost. Restore: push: [main], pull_request.
# Convexa monorepo CI — dashboard (Vite/TS) + api (Rust) + Playwright e2e.
# Stack: Node from .nvmrc, Cargo workspace (apps/api + libs/quant-engine).
# Minutes per month below assume 8 dispatches; every job runs on ubuntu-24.04, which GitHub bills
# 1:1, so raw minutes equal Linux-equivalent minutes.
name: CI

on:
  workflow_dispatch:
    inputs:
      affected_only:
        description: Run lint, typecheck and test only for Nx projects affected since the last successful run
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ~6 min/run -> ~48 min/month (raw = Linux-equivalent); its own jobs carry the timeouts.
  supply-chain:
    name: Supply-chain policy
    uses: ./.github/workflows/supply-chain.yml
    with:
      contract_event: ${{ github.event_name == 'pull_request' && 'pull_request' || 'default_branch' }}
      contract_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      contract_base_revision: ${{ github.event.pull_request.base.sha || github.sha }}
      contract_path: policy
    permissions:
      contents: read
      actions: read

  # ~18 min/run -> ~144 min/month (raw = Linux-equivalent).
  frontend:
    name: Frontend (lint · typecheck · test · build · e2e)
    runs-on: ubuntu-24.04
    # Longest of the last 10 successful runs 24.1 min x 1.5.
    timeout-minutes: 37
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build generated API declarations
        run: npx tsc -p libs/api/tsconfig.lib.json --pretty false

      - name: API contract check
        run: npm run api:contract:check

      # Hermetic tool and guard specs (tools/test-tools.mjs): ~1 min.
      - name: Tool and guard specs
        run: npm run test:tools

      # Scoped Prettier (package.json) — never bare `nx format:write` (repo-wide hazard).
      - name: Format check
        run: npm run format:check

      - name: Set Nx base and head for affected
        if: ${{ inputs.affected_only }}
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1

      # The production build below always runs: the bundle and browser gates need it.
      - name: Affected lint, typecheck and test
        if: ${{ inputs.affected_only }}
        run: npx nx affected -t lint typecheck test

      - name: Lint
        if: ${{ !inputs.affected_only }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !inputs.affected_only }}
        run: npm run typecheck

      - name: Unit tests (Vitest)
        if: ${{ !inputs.affected_only }}
        # Hosted runners become timing-sensitive when Vitest saturates every reported CPU, and the
        # jsdom diagnostics can otherwise push the useful failure summary past GitHub's log cap.
        run: |
          set +e
          log="$RUNNER_TEMP/vitest.log"
          npx nx run-many -t test -p @convexa/dashboard,@convexa/api -- --reporter=dot --maxWorkers=2 --silent=passed-only >"$log" 2>&1
          status=$?
          tail -n 250 "$log"
          exit "$status"

      - name: Upload Vitest log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-log
          path: ${{ runner.temp }}/vitest.log
          retention-days: 7

      - name: Production build (dashboard)
        run: npm run build:dashboard
        env:
          VITE_DATA_MODE: live

      # §3.8 Phase A — gzip chunk budgets (see tools/check-dashboard-bundle.mjs).
      - name: Bundle size gate
        run: npm run check:bundle

      - name: Read Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Browser quality engine install
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Browser quality gate
        id: browser_quality
        run: npm run browser:quality
        env:
          CI: true
          VITE_DATA_MODE: live

      - name: Upload Chromium browser evidence
        if: always() && steps.browser_quality.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-quality-chromium
          path: apps/dashboard-e2e/test-output/playwright/chromium
          retention-days: 7
          if-no-files-found: error

      - name: Upload compatibility browser evidence
        if: always() && steps.browser_quality.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-quality-compatibility
          path: apps/dashboard-e2e/test-output/playwright/compatibility
          retention-days: 7
          if-no-files-found: error

      - name: Upload accessibility browser evidence
        if: always() && steps.browser_quality.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-quality-accessibility
          path: apps/dashboard-e2e/test-output/playwright/accessibility
          retention-days: 7
          if-no-files-found: error

      - name: Demo build-mode guard (G5)
        run: node --test tools/build-dashboard.spec.mjs

      - name: Demo production build
        run: npm run build:dashboard
        env:
          VITE_DATA_MODE: demo

      - name: Demo browser journey (G1)
        run: npx playwright test --config apps/dashboard-e2e/playwright.demo.config.ts
        env:
          CI: true
          BROWSER_QUALITY_PREBUILD_STATUS: pass
          BROWSER_QUALITY_PORT: "4217"

      - name: Upload demo browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-demo
          path: apps/dashboard-e2e/test-output/playwright/demo
          retention-days: 7
          if-no-files-found: warn

  # ~26 min/run -> ~208 min/month (raw = Linux-equivalent).
  backend:
    name: Backend (cargo test · release+postgres)
    runs-on: ubuntu-24.04
    # Longest of the last 10 successful runs 30.4 min x 1.5 = 45.6, capped at 45.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.10-trixie@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: convexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d convexa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      # `Cargo test` runs the capacity byte-identity self-test, which runs `npm run api:contract:check`
      # (capacity/identity.rs run_contract_check), and that check needs the generated declarations.
      # The contract check as its own step still runs once, in the frontend job.
      - name: Build generated API declarations
        run: npx tsc -p libs/api/tsconfig.lib.json --pretty false

      # ubuntu-24.04 preinstalls ~25 GB of toolchains this job never touches. The merged tree
      # builds 62 debug test binaries, which exhausted the runner *inside* `Cargo test` — before
      # either `cargo clean` below could reclaim anything (run 33608643054, 2026-09-02: "No space
      # left on device", then `ld` died with SIGBUS). Reclaim up front, not just between steps.
      - name: Free preinstalled runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install baseline Rust 1.97.1
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # reviewed-commit-2026-08-05
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: |
            . -> target

      # Default features (JSON stores) — full unit/integration surface for api-rust + quant-engine.
      - name: Cargo test
        run: cargo test -p api-rust -p quant-engine --locked

      - name: Free default-feature debug build space
        run: cargo clean

      - name: Production runtime guardrails (postgres)
        run: cargo test -p api-rust --features postgres --test production_runtime_guardrails_postgres --locked -- --nocapture
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/convexa_test

      - name: PostgreSQL release safety
        run: cargo test -p api-rust --features postgres --test postgres_release_safety_postgres --locked -- --nocapture
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/convexa_test
          RELEASE_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          POSTGRES_RELEASE_NEGATIVE_CONTROL_OUT: ${{ runner.temp }}/postgres-release-negative-control.json

      - name: Upload PostgreSQL release safety evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-release-negative-control
          path: ${{ runner.temp }}/postgres-release-negative-control.json
          if-no-files-found: error

      - name: Free debug build space
        run: cargo clean

      # Matches Railway/Docker production image (`--features postgres`).
      - name: Cargo release build (postgres)
        run: cargo build -p api-rust --release --features postgres --locked

      # Reuses the release build above (same profile and features), so release compiles once.
      - name: Capacity load harness
        run: cargo run -p api-rust --locked --release --features postgres -- capacity load
        env:
          CONVEXA_CAPACITY_CI_STEP: "1"
          APP_ENV: dev

  # ~7 min/run -> ~56 min/month (raw = Linux-equivalent).
  capacity-linux:
    name: Capacity baseline (Linux)
    runs-on: ubuntu-24.04
    # Longest of the last 10 successful runs 6.7 min x 1.5 = 10, floor 15.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Build generated API declarations
        run: npx tsc -p libs/api/tsconfig.lib.json --pretty false

      - name: Install baseline Rust 1.97.1
        run: |
          rustup toolchain install 1.97.1 --profile minimal --no-self-update
          rustup default 1.97.1
          rustc --version --verbose

      - name: Cache cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: |
            . -> target

      # Fixture-only capacity evidence is intentionally a separate Linux gate. It never
      # contacts production or vendor services and is not a substitute for Windows evidence.
      - name: Capacity focused tests
        run: |
          cargo test -p api-rust --test capacity_isolation --locked -- --nocapture

      - name: Capacity self-tests and normal profile
        run: |
          npm run capacity:baseline:self-test:connector-poison
          npm run capacity:baseline:self-test:optional-fault
          npm run capacity:baseline:self-test:byte-identity
          npm run capacity:baseline

      - name: Upload capacity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: capacity-baseline-linux
          path: |
            apps/api/data/capacity/capacity-baseline-normal.json
            apps/api/data/capacity/self-tests/*.json
          if-no-files-found: error
