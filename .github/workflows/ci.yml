name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      # Playwright needs its browser binary; chromium only, matching the suite's projects.
      # (The suite migrated from Cypress on 2026-07-28 — Cypress downloaded its binary via a
      # postinstall hook, Playwright is explicit about it.)
      - run: npx playwright install --with-deps chromium

      - run: npx nx format:check --base="remotes/origin/main"
      # This workspace is not connected to Nx Cloud, so the Cloud-only steps
      # (start-ci-run, record, fix-ci, the atomized e2e-ci target) are omitted;
      # plain "e2e" runs the Playwright suite in a single task instead. It keeps
      # its own step so the dev server + browser never compete with the vitest
      # workers for the runner's CPUs (that contention flaked the unit tests
      # under Cypress, and the separation is still worth keeping).
      # `api:test` is EXCLUDED here on purpose: like this repo's other api targets (serve,
      # serve-worker, conformance) it invokes the Windows venv path `.venv\Scripts\python.exe`,
      # which does not exist on a Linux runner. It runs in its own step below instead, so the
      # backend suite is genuinely in CI rather than nominally in it.
      - run: npx nx run-many -t lint test build typecheck --exclude=api
      - run: npx nx run dashboard-e2e:e2e

      # Backend tests (apps/api/tests).
      #
      # This step used to install requirements-dev.txt ALONE, on the premise that the suite imported
      # only `src.core.signals` and therefore needed nothing beyond pytest and the stdlib. That
      # premise died with broker-connect: `test_broker_book_endpoints.py` and
      # `test_broker_credential_endpoints.py` are ENDPOINT tests built on `fastapi.testclient`, and
      # they also import `src.auth` / `src.broker.service`, which pull the real dependency tree.
      # Collection failed with `ModuleNotFoundError: No module named 'fastapi'`, so the whole
      # backend suite was skipped — the exact "nominally in CI rather than genuinely in it" failure
      # the note above this step exists to prevent.
      #
      # So install the runtime pins too. This does NOT touch the production image: apps/api/
      # Dockerfile installs requirements.txt only, and requirements-dev.txt (the test runner) stays
      # out of it — that separation was always about the image surface, never about CI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/api/requirements.txt -r apps/api/requirements-dev.txt
      - run: python -m pytest
        working-directory: apps/api
