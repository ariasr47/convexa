# Convexa monorepo CI — dashboard (Vite/TS) + api (Rust) + Playwright e2e.
# Stack: Node from .nvmrc, Cargo workspace (apps/api + libs/quant-engine).
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply-chain policy
    uses: ./.github/workflows/supply-chain.yml
    with:
      contract_event: ${{ github.event_name == 'pull_request' && 'pull_request' || 'default_branch' }}
      contract_revision: ${{ github.event.pull_request.head.sha || github.sha }}
      contract_path: policy
    permissions:
      contents: read
      actions: read

  frontend:
    name: Frontend (lint · typecheck · test · build · e2e)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          filter: tree:0
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: API contract check
        run: npm run api:contract:check

      # Scoped Prettier (package.json) — never bare `nx format:write` (repo-wide hazard).
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        # Hosted runners become timing-sensitive when Vitest saturates every reported CPU, and the
        # jsdom diagnostics can otherwise push the useful failure summary past GitHub's log cap.
        run: |
          set +e
          log="$RUNNER_TEMP/vitest.log"
          npx nx run-many -t test -p @convexa/dashboard,@convexa/api -- --reporter=dot --maxWorkers=2 --silent=passed-only >"$log" 2>&1
          status=$?
          tail -n 250 "$log"
          exit "$status"

      - name: Upload Vitest log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vitest-log
          path: ${{ runner.temp }}/vitest.log
          retention-days: 7

      - name: Production build (dashboard)
        run: npx nx build @convexa/dashboard --configuration=production

      # §3.8 Phase A — gzip chunk budgets (see tools/check-dashboard-bundle.mjs).
      - name: Bundle size gate
        run: npm run check:bundle

      # Chromium only (matches playwright.config.ts). Separate from unit tests so the
      # browser does not contend with Vitest workers for CPU.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npx nx run dashboard-e2e:e2e
        env:
          CI: true

  backend:
    name: Backend (cargo test · release+postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10-trixie@sha256:7958605b474b3d264a969cb3a123d6aa00ad1e1fe9da8a69984dabb704d93317
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: convexa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d convexa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          filter: tree:0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: API contract check
        run: npm run api:contract:check

      - name: Install baseline Rust 1.97.1
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # reviewed-commit-2026-08-05
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          workspaces: |
            . -> target

      # Default features (JSON stores) — full unit/integration surface for api-rust + quant-engine.
      - name: Cargo test
        run: cargo test -p api-rust -p quant-engine --locked

      - name: Production runtime guardrails (postgres)
        run: cargo test -p api-rust --features postgres --test production_runtime_guardrails_postgres --locked -- --nocapture
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/convexa_test

      - name: PostgreSQL release safety
        run: cargo test -p api-rust --features postgres --test postgres_release_safety_postgres --locked -- --nocapture
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/convexa_test
          RELEASE_GIT_SHA: ${{ github.sha }}
          POSTGRES_RELEASE_NEGATIVE_CONTROL_OUT: ${{ runner.temp }}/postgres-release-negative-control.json

      - name: Upload PostgreSQL release safety evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-release-negative-control
          path: ${{ runner.temp }}/postgres-release-negative-control.json
          if-no-files-found: error

      # Matches Railway/Docker production image (`--features postgres`).
      - name: Cargo release build (postgres)
        run: cargo build -p api-rust --release --features postgres --locked
