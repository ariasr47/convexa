# ============================================================================
# Convexa — LOCAL / DEV one-command full stack.
#
#   docker compose up --build
#   -> open http://localhost:8080  (dashboard; /api/* proxied to api-rust)
#
# Production backend is Railway **api-rust** (Python FastAPI is retired).
# Local secrets: copy apps/api/.env.example → apps/api/.env (or a root .env)
# and pass MASSIVE_API_KEY / AUTH_* / AI_KEY_ENCRYPTION_KEY. Never bake secrets
# into image layers.
# ============================================================================

services:
  api:
    build:
      context: .
      dockerfile: apps/api-rust/Dockerfile
    image: convexa-api-rust
    env_file:
      - ./apps/api/.env
    environment:
      HTTP_BIND: 0.0.0.0:8000
      PORT: "8000"
      AUTH_COOKIE_SECURE: "false"
      POSITIONS_PROVIDER: stub
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8000 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    image: convexa-web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
